<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rutu Setu — Bridging surplus and need</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">

<script>tailwind.config={theme:{extend:{colors:{plum:'#4B244A',lav:'#E9DDF2',cream:'#FFF9F3',coral:'#D98B86',sage:'#A9B9A5',char:'#29252B'},fontFamily:{sans:['Inter','system-ui','sans-serif'],serif:['Fraunces','Georgia','serif']}}}}</script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{background:#FFF9F3;color:#29252B}.card{background:#fff;border-radius:1.25rem;box-shadow:0 2px 14px rgba(75,36,74,.08)}.btn{border-radius:9999px;padding:.6rem 1.25rem;font-weight:600;transition:.2s;display:inline-block;cursor:pointer}.btn:hover{transform:translateY(-1px)}.p{background:#4B244A;color:#fff}.s{background:#E9DDF2;color:#4B244A}.o{border:1.5px solid #4B244A;color:#4B244A}.inp{width:100%;border:1.5px solid #E9DDF2;border-radius:.75rem;padding:.6rem .8rem;background:#fff}.inp:focus{outline:2px solid #D98B86}label{font-size:.85rem;font-weight:600;display:block;margin-bottom:.2rem}.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}</style></head>
<body class="font-sans"><div id="app"></div><div id="modal" class="hidden fixed inset-0 z-50 bg-char/50 flex items-center justify-center p-4"></div><div id="toast" class="fixed bottom-5 right-5 z-[60]"></div>
<script>
const K='rutusetu_v1',dt=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),$=s=>document.querySelector(s);
const CATS=['Sanitary Napkins','Tampons','Menstrual Cups','Panty Liners','Period Kits','Other Menstrual Hygiene Products'];
const FLOW=['Pending','Approved','Pickup Scheduled','In Transit','Delivered'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){const P=(id,name,cat,brand,qty,res,e,city,org,o)=>({id,name,cat,brand,qty,reserved:res,expiry:dt(e),cond:'New and Sealed',pack:'Sealed, undamaged',addr:org+' Store, Main Road',city,desc:'Surplus stock, unopened and stored in a dry place.',org,ownerId:o,listed:dt(-id)});
return{session:null,users:[{id:'d1',name:'Dr. Meera Rao',email:'donor@demo.in',pw:'demo1234',org:'CityCare Hospital',otype:'Hospital',city:'Bhubaneswar',phone:'9000000001',type:'donor'},{id:'r1',name:'Asha Verma',email:'ngo@demo.in',pw:'demo1234',org:'Asha Foundation',otype:'NGO',city:'Bhubaneswar',phone:'9000000002',type:'recipient'}],
products:[P(1,'Ultra Thin Pads (XL)','Sanitary Napkins','Whisper',400,60,240,'Bhubaneswar','CityCare Hospital','d1'),P(2,'Regular Tampons','Tampons','OB',150,0,18,'Cuttack','Utkal University Hostel','d1'),P(3,'Silicone Menstrual Cups','Menstrual Cups','Sirona',80,20,400,'Puri','Coastal Retail Co.','d1'),P(4,'Daily Panty Liners','Panty Liners','Stayfree',250,0,120,'Bhubaneswar','Hotel Mayfair','d1'),P(5,'Starter Period Kits','Period Kits','Rutu',60,10,90,'Rourkela','Steel City College','d1')],
requests:[{id:1,pid:1,rid:'r1',qty:60,status:'Delivered',date:dt(-9),note:'For 3 schools'},{id:2,pid:3,rid:'r1',qty:20,status:'Pending',date:dt(-1),note:''},{id:3,pid:5,rid:'r1',qty:10,status:'Approved',date:dt(-2),note:''}],
log:['Seeded demo data']}}
let S;try{S=JSON.parse(localStorage.getItem(K))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},me=()=>S.users.find(u=>u.id===S.session),uid=u=>S.users.find(x=>x.id===u);
const avail=p=>p.qty-p.reserved,expired=p=>p.expiry<dt(0);
function pstat(p){if(expired(p))return'Expired';const d=S.requests.filter(r=>r.pid==p.id&&r.status=='Delivered').reduce((a,r)=>a+r.qty,0);if(d>=p.qty)return'Donated';if(avail(p)<=0)return'Fully Reserved';return p.reserved>0?'Partially Requested':'Available'}
function toast(m,err){const t=document.createElement('div');t.className='fade card px-4 py-3 mb-2 text-sm font-medium border-l-4 '+(err?'border-coral':'border-sage');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),3500)}
function log(m){S.log.unshift(new Date().toLocaleDateString()+' — '+m);S.log=S.log.slice(0,20)}
const go=h=>{location.hash=h},badge=s=>`<span class="text-xs font-semibold px-2.5 py-1 rounded-full ${s=='Rejected'||s=='Expired'?'bg-coral/25 text-plum':s=='Delivered'||s=='Available'?'bg-sage/40':'bg-lav text-plum'}">${s}</span>`;
function shell(b){const u=me(),L=[['home','Home'],['how','How It Works'],['products','Available Products'],['about','About Us']].map(([h,t])=>`<a href="#${h}" class="hover:text-coral">${t}</a>`).join('');
return`<header class="sticky top-0 z-40 bg-cream/90 backdrop-blur border-b border-lav"><nav class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"><a href="#home" class="font-serif text-2xl text-plum font-bold">Rutu Setu</a><div class="hidden md:flex gap-6 text-sm font-medium">${L}${u?`<a href="#dash" class="hover:text-coral">Dashboard</a><a href="#impact" class="hover:text-coral">Impact</a>`:''}</div><div class="hidden md:flex gap-2 items-center">${u?`<span class="text-sm">${esc(u.org)}</span><button data-act="logout" class="btn o">Logout</button>`:`<a href="#auth" class="btn o">Login</a><a href="#auth/register" class="btn p">Get Started</a>`}</div><button data-act="menu" class="md:hidden btn s" aria-label="Menu">Menu</button></nav><div id="mm" class="hidden md:hidden px-4 pb-4 flex flex-col gap-3 text-sm font-medium">${L}${u?`<a href="#dash">Dashboard</a><a href="#impact">Impact</a><a href="#history">History</a><button data-act="logout" class="btn o">Logout</button>`:`<a href="#auth">Login</a><a href="#auth/register" class="btn p text-center">Get Started</a>`}</div></header><main class="fade">${b}</main>
<footer class="bg-plum text-lav mt-16"><div class="max-w-6xl mx-auto px-4 py-10 grid md:grid-cols-3 gap-8 text-sm"><div><div class="font-serif text-xl text-white">Rutu Setu</div><p class="mt-2">Bridging surplus and need, one cycle at a time.<br>Team Kirti | ReFlow 2026</p></div><div class="space-y-1"><a href="#about" class="block">About Rutu Setu</a><a href="#about" class="block">Contact: hello@rutusetu.demo</a><a href="#about" class="block">Privacy Policy</a><a href="#about" class="block">Terms and Conditions</a><div class="pt-2">Instagram · LinkedIn · X</div></div><p class="text-xs opacity-80">Disclaimer: product eligibility and redistribution must follow applicable hygiene, safety, and local guidelines. Only unused, unopened, unexpired products may be listed.</p></div></footer>`}
const hero=()=>`<section class="bg-gradient-to-br from-lav via-cream to-cream"><div class="max-w-6xl mx-auto px-4 py-16 md:py-24 grid md:grid-cols-2 gap-10 items-center"><div><h1 class="font-serif text-4xl md:text-6xl text-plum leading-tight">Turning Surplus into Support.</h1><p class="mt-5 text-lg">Connecting surplus menstrual hygiene products with communities that need them. Together, we can reduce waste and make menstrual hygiene more accessible.</p><div class="mt-7 flex flex-wrap gap-3"><a href="#auth/register" class="btn p">Donate Surplus</a><a href="#products" class="btn o">Find Supplies</a></div></div><svg viewBox="0 0 400 300" class="w-full"><rect x="20" y="170" width="120" height="100" rx="16" fill="#4B244A"/><rect x="40" y="190" width="30" height="30" rx="6" fill="#E9DDF2"/><rect x="85" y="190" width="30" height="30" rx="6" fill="#E9DDF2"/><rect x="260" y="190" width="120" height="80" rx="16" fill="#A9B9A5"/><path d="M140 200 Q200 90 260 200" stroke="#D98B86" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="200" cy="120" r="34" fill="#D98B86"/><path d="M200 138c-14-10-18-18-18-26a9 9 0 0 1 18-2 9 9 0 0 1 18 2c0 8-4 16-18 26z" fill="#fff"/><text x="80" y="160" font-size="13" fill="#4B244A" text-anchor="middle" font-weight="600">Institutions</text><text x="320" y="180" font-size="13" fill="#29252B" text-anchor="middle" font-weight="600">Communities</text></svg></div></section>`;
const step=(n,t,d)=>`<div class="card p-6"><div class="w-9 h-9 rounded-full bg-plum text-white grid place-items-center font-bold">${n}</div><h3 class="font-semibold mt-3">${t}</h3><p class="text-sm mt-1">${d}</p></div>`;
const HOW=`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${step(1,'List Surplus','Donors post unused, sealed, unexpired products.')+step(2,'Match Needs','Recipients browse and request the quantity they need.')+step(3,'Arrange Pickup and Delivery','Donor approves; pickup details are shared.')+step(4,'Track Impact','Every delivery updates live impact statistics.')}</div>`;
const sec=(t,b,c='')=>`<section class="max-w-6xl mx-auto px-4 py-12 ${c}"><h2 class="font-serif text-3xl text-plum mb-6">${t}</h2>${b}</section>`;
const V={
home(){return hero()+sec('The Problem',`<div class="grid md:grid-cols-3 gap-4">${['Institutions accumulate unused menstrual hygiene products.','No reliable redistribution channel exists.','Underserved communities continue to face shortages.'].map(t=>`<div class="card p-6 border-t-4 border-coral">${t}</div>`).join('')}</div>`)+sec('Our Solution','<p class="max-w-3xl text-lg">Rutu Setu is a centralized redistribution platform: a circular-economy marketplace linking hospitals, colleges, hostels, retailers and CSR teams with NGOs, shelters, schools and ASHA workers.</p>')+sec('How It Works',HOW)+sec('Who We Serve',`<div class="grid md:grid-cols-2 gap-4"><div class="card p-6"><b class="text-plum">Donors</b><p class="text-sm mt-2">Hospitals · Colleges · Hostels · NGOs with surplus · Retailers · Hotels · CSR organizations</p></div><div class="card p-6"><b class="text-plum">Recipients</b><p class="text-sm mt-2">NGOs · Shelters · ASHA workers · Schools · Community organizations</p></div></div>`)+
`<section class="bg-lav py-12"><div class="max-w-6xl mx-auto px-4"><h2 class="font-serif text-3xl text-plum mb-1">Impact</h2><p class="text-xs mb-5">Illustrative demo figures, not real data.</p><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${[['Products redistributed',48500],['Institutions onboarded',126],['NGOs supported',212],['Products saved from waste',61200]].map(([l,n])=>`<div class="card p-5 text-center"><div class="text-3xl font-bold text-plum" data-count="${n}">0</div><div class="text-sm mt-1">${l}</div></div>`).join('')}</div></div></section>`+`<section class="max-w-6xl mx-auto px-4 py-14 text-center"><h2 class="font-serif text-3xl text-plum">Every unused product can make a difference.</h2><div class="mt-6 flex gap-3 justify-center flex-wrap"><a href="#auth/register" class="btn p">Become a Donor</a><a href="#auth/register" class="btn o">Request Supplies</a></div></section>`},
how(){return sec('How It Works',HOW)},
about(){return sec('About Rutu Setu',`<div class="card p-6 space-y-3 max-w-3xl"><p>Built by Team Kirti for ReFlow 2026 as a hackathon MVP. Data is stored in your browser (demo mode); production use requires Supabase configuration.</p><p><b>Safety:</b> only unused, unopened, hygienically safe, unexpired products may be listed. Redistribution must follow applicable hygiene, safety and local guidelines.</p><p><b>Privacy:</b> we collect only organization details; pickup addresses and contacts stay hidden until a request is approved.</p><p><b>Contact:</b> hello@rutusetu.demo</p></div>`)},
auth(a){const reg=a=='register',t=(h,l,on)=>`<a href="#auth${h}" class="flex-1 text-center py-2 rounded-full ${on?'bg-plum text-white':'bg-lav text-plum'} font-semibold">${l}</a>`,pw=`<div><label>Password</label><div class="relative"><input name="pw" type="password" class="inp pr-16" required minlength="6"><button type="button" data-act="eye" class="absolute right-3 top-2.5 text-xs font-semibold text-plum">Show</button></div></div>`;
return`<div class="max-w-md mx-auto px-4 py-12"><div class="card p-6"><div class="flex gap-2 mb-5">${t('','Login',!reg)}${t('/register','Register',reg)}</div><form data-form="${reg?'reg':'login'}" class="space-y-3" novalidate>${reg?`<div><label>Full Name</label><input name="name" class="inp"></div>`:''}<div><label>Email</label><input name="email" type="email" class="inp"></div>${pw}${reg?`<div><label>Organization Name</label><input name="org" class="inp"></div><div><label>Organization Type</label><select name="otype" class="inp">${['Hospital','College/University','Hostel','NGO','School','Shelter','Retailer','Hotel','CSR','Other'].map(o=>`<option>${o}</option>`).join('')}</select></div><div class="grid grid-cols-2 gap-3"><div><label>City</label><input name="city" class="inp"></div><div><label>Phone</label><input name="phone" class="inp"></div></div><div><label>Account Type</label><select name="type" class="inp"><option value="donor">Donor</option><option value="recipient">Recipient</option></select></div>`:''}<div id="err" class="text-sm text-coral font-semibold"></div><button class="btn p w-full" id="sub">${reg?'Create account':'Log in'}</button></form><div class="mt-5 pt-4 border-t border-lav text-sm"><p class="mb-2 font-semibold">Demo access (no backend needed)</p><div class="flex gap-2"><button data-act="demo" data-u="d1" class="btn s flex-1">Demo Donor</button><button data-act="demo" data-u="r1" class="btn s flex-1">Demo Recipient</button></div></div></div></div>`},
products(){const f=window.F||{},cities=[...new Set(S.products.map(p=>p.city))];let L=S.products.filter(p=>!expired(p)&&avail(p)>0);
if(f.q)L=L.filter(p=>(p.name+p.brand+p.org).toLowerCase().includes(f.q.toLowerCase()));if(f.cat)L=L.filter(p=>p.cat==f.cat);if(f.city)L=L.filter(p=>p.city==f.city);if(f.min)L=L.filter(p=>avail(p)>=+f.min);if(f.exp)L=L.filter(p=>p.expiry<=dt(+f.exp));L.sort((a,b)=>b.listed.localeCompare(a.listed)||b.id-a.id);
const o=(a,v)=>a.map(x=>`<option ${v==x?'selected':''}>${x}</option>`).join('');
return sec('Available Products',`<div class="card p-4 grid sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-6"><input data-f="q" value="${esc(f.q||'')}" placeholder="Search products or donors" class="inp lg:col-span-2"><select data-f="cat" class="inp"><option value="">All categories</option>${o(CATS,f.cat)}</select><select data-f="city" class="inp"><option value="">All cities</option>${o(cities,f.city)}</select><select data-f="exp" class="inp"><option value="">Any expiry</option><option value="90" ${f.exp=='90'?'selected':''}>Within 90 days</option><option value="180" ${f.exp=='180'?'selected':''}>Within 180 days</option></select><input data-f="min" type="number" min="0" value="${esc(f.min||'')}" placeholder="Min quantity" class="inp"></div><p class="text-xs mb-4">Sorted by newest listings. ${L.length} result(s).</p><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${L.map(p=>`<div class="card overflow-hidden"><div class="h-32 bg-gradient-to-br from-lav to-sage/50 grid place-items-center text-plum font-serif text-lg px-3 text-center">${esc(p.cat)}</div><div class="p-5"><h3 class="font-semibold">${esc(p.name)}</h3><p class="text-sm mt-1">${avail(p)} available · Expires ${p.expiry}</p><p class="text-sm">${esc(p.cond)}</p><p class="text-sm">${esc(p.org)} · ${esc(p.city)}</p><div class="mt-4 flex gap-2"><button data-act="view" data-id="${p.id}" class="btn s">Details</button><button data-act="view" data-id="${p.id}" class="btn p">Request Supplies</button></div></div></div>`).join('')||'<p>No products match.</p>'}</div>`)},
dash(){const u=me();if(!u)return go('auth');return u.type=='donor'?donor(u):recip(u)},
new(id){const u=me();if(!u||u.type!='donor')return go('auth');const p=S.products.find(x=>x.id==id)||{};const i=(n,l,t='text',x='')=>`<div><label>${l}</label><input name="${n}" type="${t}" value="${esc(p[n]??(n=='city'?u.city:''))}" class="inp" ${x}></div>`;
return sec(p.id?'Edit Listing':'List Surplus',`<form data-form="prod" data-id="${p.id||''}" class="card p-6 grid md:grid-cols-2 gap-4 max-w-3xl" novalidate>${i('name','Product Name')}<div><label>Category</label><select name="cat" class="inp">${CATS.map(c=>`<option ${p.cat==c?'selected':''}>${c}</option>`).join('')}</select></div>${i('brand','Brand (optional)')}${i('qty','Quantity Available','number','min="1"')}${i('expiry','Expiry Date','date',`min="${dt(1)}"`)}<div><label>Product Condition</label><select name="cond" class="inp"><option>New and Sealed</option><option ${p.cond=='Unused and Intact Packaging'?'selected':''}>Unused and Intact Packaging</option></select></div>${i('pack','Packaging Condition')}${i('city','City')}<div class="md:col-span-2">${i('addr','Pickup Address (private until approved)')}</div><div class="md:col-span-2"><label>Description</label><textarea name="desc" class="inp" rows="3">${esc(p.desc||'')}</textarea></div><div class="md:col-span-2"><label>Product Image (optional)</label><input type="file" accept="image/*" class="inp"><p class="text-xs mt-1">Image upload needs Supabase Storage; skipped in demo mode.</p></div><label class="md:col-span-2 flex gap-2 items-start font-normal"><input type="checkbox" name="ok"> I confirm these products are unused, unopened, hygienically safe and not expired.</label><div id="err" class="md:col-span-2 text-sm text-coral font-semibold"></div><div class="md:col-span-2 flex gap-3"><button class="btn p">${p.id?'Save changes':'Add to inventory'}</button><a href="#dash" class="btn o">Cancel</a></div></form>`)},
history(){const u=me();if(!u)return go('auth');const R=myReqs(u).filter(r=>['Delivered','Rejected'].includes(r.status));return sec('Donation History',tbl(R,u,false))},
impact(){const P=S.products,R=S.requests,del=R.filter(r=>r.status=='Delivered').reduce((a,r)=>a+r.qty,0),listed=P.reduce((a,p)=>a+p.qty,0),act=R.filter(r=>r.status!='Rejected'),rate=act.length?Math.round(100*act.filter(r=>r.status=='Delivered').length/act.length):0,soon=P.filter(p=>!expired(p)&&p.expiry<=dt(60)).length,mx=Math.max(1,...CATS.map(c=>P.filter(p=>p.cat==c).reduce((a,p)=>a+p.qty,0)));
const st=(l,v)=>`<div class="card p-5"><div class="text-3xl font-bold text-plum">${v}</div><div class="text-sm">${l}</div></div>`;
return sec('Impact Dashboard',`<p class="text-xs mb-4">Computed live from demo data in this browser.</p><div class="grid grid-cols-2 lg:grid-cols-3 gap-4">${st('Products listed',listed)+st('Products redistributed',del)+st('Institutions participating',new Set(P.map(p=>p.org)).size)+st('Recipient orgs supported',new Set(R.filter(r=>r.status=='Delivered').map(r=>r.rid)).size)+st('Listings expiring within 60 days',soon)+st('Redistribution completion rate',rate+'%')}</div><div class="card p-6 mt-6"><h3 class="font-semibold mb-4">Listed quantity by category</h3>${CATS.map(c=>{const n=P.filter(p=>p.cat==c).reduce((a,p)=>a+p.qty,0);return`<div class="mb-3"><div class="flex justify-between text-sm"><span>${c}</span><span>${n}</span></div><div class="h-3 bg-lav rounded-full"><div class="h-3 rounded-full bg-plum" style="width:${100*n/mx}%"></div></div></div>`}).join('')}</div>`)}};
function myReqs(u){return S.requests.filter(r=>u.type=='donor'?S.products.find(p=>p.id==r.pid)?.ownerId==u.id:r.rid==u.id)}
function tbl(R,u,act){if(!R.length)return'<p class="text-sm">Nothing here yet.</p>';return`<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-lav text-plum text-left"><tr><th class="p-3">Product</th><th>Qty</th><th>${u.type=='donor'?'Recipient':'Donor'}</th><th>Status</th><th>Details</th>${act?'<th>Action</th>':''}</tr></thead><tbody>${R.map(r=>{const p=S.products.find(x=>x.id==r.pid),ro=uid(r.rid),ok=FLOW.indexOf(r.status)>0,i=FLOW.indexOf(r.status);return`<tr class="border-t border-lav"><td class="p-3">${esc(p.name)}</td><td>${r.qty}</td><td>${esc(u.type=='donor'?ro.org:p.org)}</td><td>${badge(r.status)}</td><td class="text-xs">${ok?`Pickup: ${esc(p.addr)}, ${esc(p.city)}<br>Contact: ${esc(u.type=='donor'?ro.phone:uid(p.ownerId).phone)}`:'Hidden until approved'}</td>${act?`<td class="py-2">${r.status=='Pending'?`<button data-act="ap" data-id="${r.id}" class="btn p !py-1">Approve</button> <button data-act="rj" data-id="${r.id}" class="btn o !py-1">Reject</button>`:ok&&i<4?`<button data-act="adv" data-id="${r.id}" class="btn s !py-1">Mark ${FLOW[i+1]}</button>`:'—'}</td>`:''}</tr>`}).join('')}</tbody></table></div>`}
const stat=(l,v)=>`<div class="card p-5"><div class="text-3xl font-bold text-plum">${v}</div><div class="text-sm">${l}</div></div>`;
function donor(u){const P=S.products.filter(p=>p.ownerId==u.id),R=myReqs(u),n=s=>R.filter(r=>r.status==s).length;
return sec(`Welcome, ${esc(u.name)}`,`<div class="flex flex-wrap gap-3 mb-6"><a href="#new" class="btn p">+ List Surplus</a><a href="#history" class="btn o">History</a><a href="#impact" class="btn s">Impact</a></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${stat('Products listed',P.length)+stat('Units donated',R.filter(r=>r.status=='Delivered').reduce((a,r)=>a+r.qty,0))+stat('Pending requests',n('Pending'))+stat('Completed',n('Delivered'))}</div><h3 class="font-semibold mt-8 mb-3">Requests</h3>${tbl(R.filter(r=>r.status!='Rejected'),u,true)}<h3 class="font-semibold mt-8 mb-3">My listings</h3><div class="card overflow-x-auto"><table class="w-full text-sm"><tbody>${P.map(p=>`<tr class="border-t border-lav"><td class="p-3">${esc(p.name)}</td><td>${avail(p)}/${p.qty} left</td><td>${p.expiry}</td><td>${badge(pstat(p))}</td><td><a href="#new/${p.id}" class="text-plum font-semibold">Edit</a></td></tr>`).join('')}</tbody></table></div><h3 class="font-semibold mt-8 mb-3">Recent activity</h3><ul class="card p-4 text-sm space-y-1">${S.log.slice(0,6).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`)}
function recip(u){const R=myReqs(u),n=s=>R.filter(r=>r.status==s).length;
return sec(`Welcome, ${esc(u.name)}`,`<div class="flex gap-3 mb-6"><a href="#products" class="btn p">Browse Products</a><a href="#history" class="btn o">History</a></div><div class="grid grid-cols-2 lg:grid-cols-5 gap-4">${stat('Available products',S.products.filter(p=>!expired(p)&&avail(p)>0).length)+stat('Submitted',R.length)+stat('Pending',n('Pending'))+stat('Approved',n('Approved'))+stat('Delivered',n('Delivered'))}</div><h3 class="font-semibold mt-8 mb-3">My Requests</h3>${tbl(R,u,false)}`)}
function render(){const [r,a]=(location.hash.slice(1)||'home').split('/');const f=V[r]||V.home;const h=f(a);if(h===undefined)return;$('#app').innerHTML=shell(h);window.scrollTo(0,0);document.querySelectorAll('[data-count]').forEach(e=>{const t=+e.dataset.count;let s=0;const iv=setInterval(()=>{s+=t/40;if(s>=t){s=t;clearInterval(iv)}e.textContent=Math.round(s).toLocaleString()},30)})}
function openProd(id){const p=S.products.find(x=>x.id==id),u=me(),can=u?.type=='recipient'&&avail(p)>0&&!expired(p);
$('#modal').innerHTML=`<div class="card p-6 max-w-md w-full max-h-[90vh] overflow-auto fade"><div class="flex justify-between"><h3 class="font-serif text-xl text-plum">${esc(p.name)}</h3><button data-act="close" class="font-bold">✕</button></div><p class="text-sm mt-2">${esc(p.cat)}${p.brand?' · '+esc(p.brand):''}</p><p class="text-sm">${avail(p)} available · Expires ${p.expiry}</p><p class="text-sm">${esc(p.cond)} · ${esc(p.pack)}</p><p class="text-sm">${esc(p.org)}, ${esc(p.city)}</p><p class="text-sm mt-2">${esc(p.desc)}</p><p class="text-xs mt-2 bg-lav rounded-lg p-2">Pickup address and contact are shared only after the donor approves your request.</p>${can?`<form data-form="req" data-id="${p.id}" class="mt-4 space-y-3"><div><label>Quantity (max ${avail(p)})</label><input name="qty" type="number" min="1" max="${avail(p)}" class="inp"></div><div><label>Note (optional)</label><input name="note" class="inp"></div><div id="err" class="text-sm text-coral font-semibold"></div><button class="btn p w-full">Submit request</button></form>`:`<p class="mt-4 text-sm font-semibold">${u?(u.type=='donor'?'Donor accounts cannot request supplies.':'Not available.'):'Log in as a recipient to request.'}</p>${u?'':'<a href="#auth" data-act="close" class="btn p mt-2">Log in</a>'}`}</div>`;$('#modal').classList.remove('hidden')}
const closeM=()=>$('#modal').classList.add('hidden');
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=+t.dataset.id;
if(a=='menu')$('#mm').classList.toggle('hidden');
else if(a=='eye'){const i=t.parentNode.querySelector('input');i.type=i.type=='password'?'text':'password';t.textContent=i.type=='password'?'Show':'Hide'}
else if(a=='close')closeM();else if(a=='view')openProd(id);
else if(a=='logout'){S.session=null;save();toast('Logged out');go('home');render()}
else if(a=='demo'){S.session=t.dataset.u;save();toast('Signed in with demo account');go('dash');render()}
else{const r=S.requests.find(x=>x.id==id),p=r&&S.products.find(x=>x.id==r.pid);if(!r||p.ownerId!=S.session)return;
if(a=='ap'){r.status='Approved';log('Approved request for '+p.name)}
if(a=='rj'){r.status='Rejected';p.reserved-=r.qty;log('Rejected request for '+p.name)}
if(a=='adv'){r.status=FLOW[FLOW.indexOf(r.status)+1];log(p.name+' → '+r.status)}
save();toast('Request updated');render()}});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(!k)return;window.F={...(window.F||{}),[k]:e.target.value};const p=e.target.selectionStart;render();const n=document.querySelector(`[data-f="${k}"]`);if(n&&n.tagName=='INPUT'){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}});
document.addEventListener('submit',async e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),err=m=>{const x=$('#err');if(x)x.textContent=m;return 0};
if(f=='login'){const u=S.users.find(x=>x.email==d.email?.trim().toLowerCase()&&x.pw==d.pw);if(!u)return err('Invalid email or password.');$('#sub').textContent='Signing in…';await new Promise(r=>setTimeout(r,400));S.session=u.id;save();toast('Welcome back!');go('dash');render()}
if(f=='reg'){if(!d.name||!d.org||!d.city||!d.phone)return err('Please fill in all fields.');if(!/^\S+@\S+\.\S+$/.test(d.email))return err('Enter a valid email.');if(d.pw.length<6)return err('Password must be at least 6 characters.');if(!/^\d{10}$/.test(d.phone.replace(/\D/g,'')))return err('Enter a 10-digit phone number.');if(S.users.some(x=>x.email==d.email.toLowerCase()))return err('Email already registered.');
const u={...d,email:d.email.toLowerCase(),id:'u'+Date.now()};S.users.push(u);S.session=u.id;save();toast('Account created!');go('dash');render()}
if(f=='prod'){if(!d.name||!d.addr||!d.city||!d.expiry)return err('Name, expiry, city and pickup address are required.');if(!(+d.qty>0))return err('Quantity must be at least 1.');if(d.expiry<=dt(0))return err('Expired or same-day-expiry products cannot be listed.');if(!d.ok)return err('Please confirm the safety declaration.');const u=me(),id=+e.target.dataset.id;
if(id){const p=S.products.find(x=>x.id==id);if(+d.qty<p.reserved)return err('Quantity cannot go below already requested units ('+p.reserved+').');Object.assign(p,d,{qty:+d.qty});log('Edited '+p.name)}
else{S.products.push({...d,qty:+d.qty,reserved:0,org:u.org,ownerId:u.id,listed:dt(0),id:Date.now()});log('Listed '+d.name)}
save();toast(id?'Listing updated':'Surplus listed successfully');go('dash');render()}
if(f=='req'){const p=S.products.find(x=>x.id==e.target.dataset.id),q=+d.qty;if(!(q>=1)||q>avail(p))return err('Enter a quantity between 1 and '+avail(p)+'.');if(expired(p))return err('This product has expired.');p.reserved+=q;S.requests.push({id:Date.now(),pid:p.id,rid:S.session,qty:q,status:'Pending',date:dt(0),note:d.note});log(me().org+' requested '+q+' × '+p.name);save();closeM();toast('Request submitted');go('dash');render()}});
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')closeM()});
addEventListener('hashchange',()=>{closeM();render()});render();
</script></body></html>
